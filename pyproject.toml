[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-ai-act-classifier"
version = "0.2.2"
description = "Deterministic EU AI Act (Reg (EU) 2024/1689) risk-tier and obligation classifier with pinpoint citations and a lawyer review gate."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Förste" }]
maintainers = [{ name = "Sebastian Förste" }]
keywords = ["eu-ai-act", "ai-governance", "legal-engineering", "compliance", "regtech", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business",
]

# One core dependency: Pydantic for typed models. Everything else is standard library.
# The floor is the lowest version the CI lowest-direct job passes with (2.11.0 on 3.13).
dependencies = ["pydantic>=2.11"]

[project.optional-dependencies]
# The agent-callable surface. Kept optional so the core engine has no MCP dependency.
# Capped below 2: the server imports mcp.server.fastmcp, which mcp 2.0 renamed. At least
# 1.21.1: earlier releases import a pydantic internal that pydantic 2.14 removed.
mcp = ["mcp>=1.21.1,<2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
eu-ai-act-classifier = "eu_ai_act_classifier.cli:main"
eu-ai-act-classifier-mcp = "eu_ai_act_classifier.mcp_server:main"
eu-ai-act-classify = "eu_ai_act_classifier.cli:main"
eu-ai-act-local-api = "eu_ai_act_classifier.local_api:main"

[project.urls]
Homepage = "https://github.com/sebastianfoerste/eu-ai-act-classifier"
Source = "https://github.com/sebastianfoerste/eu-ai-act-classifier"
Issues = "https://github.com/sebastianfoerste/eu-ai-act-classifier/issues"
Changelog = "https://github.com/sebastianfoerste/eu-ai-act-classifier/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_ai_act_classifier"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
