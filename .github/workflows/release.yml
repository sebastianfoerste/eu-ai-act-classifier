name: Release

# Publishes to PyPI through Trusted Publishing when a GitHub release is published.
# The PyPI project trusts this file name and the `pypi` environment; renaming either
# breaks publishing until the publisher on PyPI is changed to match.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "$project_version" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $project_version"
            exit 1
          fi
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/smoke" --python 3.13
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/eu-ai-act-classify" examples/spam_filter.json > /dev/null
          set +e
          "$RUNNER_TEMP/smoke/bin/eu-ai-act-classify" examples/social_scoring.json --strict > /dev/null
          status=$?
          set -e
          test "$status" -eq 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/eu-ai-act-classifier/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
